<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ultrix Shoe Palace</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>ULTRIX</h1>
                    <p>SHOE PALACE</p>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link">Shop</a>
                    <a href="customer-login.html" class="nav-link">Customer Login</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="auth-page">
        <div class="auth-container">
            <div class="auth-card admin-card">
                <div class="admin-badge">ADMIN</div>
                <h2>Admin Portal</h2>
                <p class="auth-subtitle">Secure administrative access</p>
                
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="email">Admin Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Admin Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="error-message" id="errorMessage"></div>
                    
                    <button type="submit" class="btn btn-admin btn-full">Access Admin Panel</button>
                </form>
                
                <p class="auth-switch">
                    Not an admin? 
                    <a href="customer-login.html">Customer Login</a>
                </p>
                
                <p class="auth-switch">
                    Need admin access? 
                    <a href="admin-signup.html">Register here</a>
                </p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>ULTRIX SHOE PALACE</h3>
                    <p>Premium footwear for every occasion</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <a href="index.html">Home</a>
                    <a href="products.html">Shop</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Ultrix Shoe Palace. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
