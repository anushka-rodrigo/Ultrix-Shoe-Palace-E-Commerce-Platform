<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Ultrix Shoe Palace</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>ULTRIX</h1>
                    <p>SHOE PALACE</p>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link active">Shop</a>
                    <a href="#" class="nav-link" id="cartLink">Cart <span class="cart-badge" id="cartCount">0</span></a>
                    <a href="#" class="nav-link" id="authLink">Login</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="products-page">
        <div class="container">
            <h1 class="page-title">Our Collection</h1>
            
            <div class="products-layout">
                <aside class="filters">
                    <h3>Filter By</h3>
                    
                    <div class="filter-group">
                        <h4>Category</h4>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="all" checked>
                            <span>All</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="men">
                            <span>Men's</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="woman">
                            <span>Women's</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="kids">
                            <span>Kids'</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="sports">
                            <span>Sports</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="casual">
                            <span>Casual</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="formal">
                            <span>Formal</span>
                        </label>
                    </div>

                    <div class="filter-group">
                        <h4>Price Range</h4>
                        <div class="price-inputs">
                            <input type="number" id="minPrice" placeholder="Min" min="0">
                            <span>-</span>
                            <input type="number" id="maxPrice" placeholder="Max" min="0">
                        </div>
                        <button class="btn btn-secondary btn-small" id="applyPrice">Apply</button>
                    </div>

                    <div class="filter-group">
                        <h4>Sort By</h4>
                        <select id="sortSelect" class="sort-select">
                            <option value="default">Default</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="name-az">Name: A to Z</option>
                            <option value="name-za">Name: Z to A</option>
                        </select>
                    </div>

                    <button class="btn btn-secondary" id="clearFilters">Clear Filters</button>
                </aside>

                <div class="products-main">
                    <div class="products-header">
                        <p id="productCount">Loading products...</p>
                    </div>
                    <div class="product-grid" id="productGrid">
                        <!-- Products will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>ULTRIX SHOE PALACE</h3>
                    <p>Premium footwear for every occasion</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <a href="index.html">Home</a>
                    <a href="products.html">Shop</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Ultrix Shoe Palace. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modalProductImage" src="" alt="">
                </div>
                <div class="modal-details">
                    <h2 id="modalProductName"></h2>
                    <p class="modal-brand" id="modalProductBrand"></p>
                    <p class="modal-price" id="modalProductPrice"></p>
                    <p class="modal-description" id="modalProductDescription"></p>
                    <div class="modal-info">
                        <p><strong>Category:</strong> <span id="modalProductCategory"></span></p>
                        <p><strong>Available Stock:</strong> <span id="modalProductStock"></span></p>
                    </div>
                    <div class="modal-actions">
                        <label for="sizeSelect">Size:</label>
                        <input type="text" class="size-select" id="sizeSelect">
                        <label for="quantityInput">Quantity:</label>
                        <input type="number" id="quantityInput" min="1" max="10" value="1">
                        <button class="btn btn-primary" id="addToCartBtn">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
